<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שנים מקרא ואחד תרגום</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f6a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--card2:#fbf6ec;--ink:#2b2a28;--mut:#857e72;--acc:#2f6f6a;--acc2:#24524e;--gold:#c09a45;--line:#e8e0cf;--hl:#fff0bf;--tg:#7a4b2a;--tgbg:#fbf4ea;--ok:#3f8f5a;--okbg:#e4f2e7;--sh:0 1px 2px #3b2f1a0d,0 6px 20px #3b2f1a12;--fs:24px;color-scheme:light}
[data-t=dark]{--bg:#13161a;--card:#1c2024;--card2:#20252a;--ink:#ece6d9;--mut:#9c9588;--acc:#6fc2b8;--acc2:#9fdcd4;--gold:#d9b45f;--line:#2d333a;--hl:#4a3f1c;--tg:#e3bd94;--tgbg:#211d19;--ok:#6fcf8f;--okbg:#1d3326;--sh:0 1px 2px #0005,0 6px 20px #0004;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,"Segoe UI",Arial,sans-serif;transition:background .2s;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
button:active{transform:scale(.97)}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
[data-t=dark] button.p{color:#10201e}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px}
.hd,header>.row,.chips,#st{max-width:760px;width:100%;margin:0 auto}
.hd{display:flex;align-items:center;gap:6px}
.ttlw{flex:1;min-width:0}
.app{font-size:12px;color:var(--mut);letter-spacing:.2px}
h1{font-family:"Frank Ruhl Libre","Noto Serif Hebrew",serif;font-size:20px;line-height:1.25;font-weight:700;margin:0;color:var(--acc2)}
.ib{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:15px;font-weight:700;border-radius:11px}
.row{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;appearance:none;-webkit-appearance:none;font-weight:600;padding-inline-start:12px;padding-inline-end:34px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:left 18px center,left 13px center;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border-radius:999px;font-size:14px;padding:6px 13px;background:var(--card2)}
.chips button.dn{background:var(--okbg);color:var(--ok);border-color:transparent}
.chips button.on{background:var(--gold);color:#1d1606;border-color:var(--gold);font-weight:700}
.pc{white-space:nowrap;font-size:13px;color:var(--mut);align-self:center;padding-inline:6px;margin-inline-start:auto}
#st{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px 14px 12px}
#st summary{display:none}
#st label{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
#st input[type=checkbox]{appearance:none;-webkit-appearance:none;flex-shrink:0;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
#st input[type=checkbox]::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:right .2s}
#st input[type=checkbox]:checked{background:var(--acc)}
#st input[type=checkbox]:checked::after{right:21px}
#st button{display:block;width:100%;margin-top:10px;text-align:center}
#offs{margin-top:6px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 18px 16px;margin:0 0 16px;box-shadow:var(--sh)}
.sec h2{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--acc);margin:6px 0 4px;letter-spacing:.3px}
.sec h2::before,.sec h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.sec.t{background:var(--tgbg)}
.sec.t h2{color:var(--tg)}
.vs{font-family:"Taamey David CLM","SBL Hebrew","Ezra SIL","Noto Serif Hebrew",David,serif;font-size:var(--fs);line-height:2.05;margin:2px 0;padding:0 6px;border-radius:10px;transition:background .3s}
.t .vs{color:var(--tg)}
.vs.on{background:var(--hl);box-shadow:inset -3px 0 0 var(--gold)}
.n{display:inline-block;color:var(--gold);font-family:Heebo,sans-serif;font-size:.5em;font-weight:700;margin-inline:2px 6px;vertical-align:.35em}
.bk{padding:0 2px;font-size:.5em;opacity:.25;border:0;background:none;vertical-align:.4em}
.vs.on .bk,.bk:hover{opacity:1}
.sec.vh{padding:8px 16px}
.vh .t{border-top:1px dashed var(--line);margin-top:4px;padding-top:2px}
.mut{color:var(--mut)}
#jn[hidden]{display:none}
#jn{background:var(--hl);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;margin:0 0 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
#jn button{background:var(--card)}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
nav.bot .row{max-width:760px;margin:0 auto}
nav.bot button{min-height:46px}
nav.bot #done{flex:1;font-size:16px}
#done.dn{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1f1d1a;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9;box-shadow:0 8px 24px #0003;max-width:calc(100vw - 32px);width:max-content;text-align:center}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 0 100px}
</style>
</head>
<body>
<header>
 <div class="hd">
  <div class="ttlw">
   <div class="app">שנים מקרא ואחד תרגום</div>
   <h1 id="ttl">שנים מקרא ואחד תרגום</h1>
  </div>
  <button id="fm" class="ib" title="הקטן גופן">א−</button>
  <button id="fp" class="ib" title="הגדל גופן">א+</button>
  <button id="dm" class="ib" title="מצב כהה/בהיר">🌓</button>
  <button id="sb" class="ib" title="הגדרות">⚙️</button>
 </div>
 <details id="st" hidden>
  <summary>הגדרות</summary>
  <label><input type="checkbox" id="o-tm"> הצג טעמי מקרא</label>
  <label><input type="checkbox" id="o-vm"> מצב פסוק־פסוק (מקרא, מקרא, תרגום לכל פסוק)</label>
  <label><input type="checkbox" id="o-di"> חו״ל (פרשת השבוע לפי חו״ל)</label>
  <button id="rs">🔄 התחל מחזור חדש (איפוס כל הסימונים ✓)</button>
  <button id="off">⬇️ הורד את כל התורה לשימוש ללא אינטרנט</button>
  <div id="offs" class="mut"></div>
 </details>
 <div class="row">
  <select id="ps" aria-label="בחירת פרשה"></select>
  <button class="p" id="today">📅 היום</button>
  <button id="gb" class="ib" title="עבור לסימניה">🔖</button>
 </div>
 <div class="chips" id="ch"></div>
</header>
<main>
 <div id="jn" hidden></div>
 <div id="view"></div>
</main>
<nav class="bot">
 <div class="row">
  <button id="prev">→ הקודם</button>
  <button class="p" id="done">סיימתי ✓</button>
  <button id="next">הבא ←</button>
 </div>
</nav>
<footer>הטקסט נטען מ־Sefaria.org ונשמר במכשיר לקריאה ללא חיבור</footer>
<div id="toast"></div>
<script>
const API='https://www.sefaria.org/api/';
const TARGUM_VERSION=''; // אפשר למלא שם גרסה (עם קווים תחתונים) לתרגום מנוקד, למשל 'Version_Name'
const BOOKS=[['Genesis','בראשית','בראשית,נח,לך לך,וירא,חיי שרה,תולדות,ויצא,וישלח,וישב,מקץ,ויגש,ויחי'],
['Exodus','שמות','שמות,וארא,בא,בשלח,יתרו,משפטים,תרומה,תצוה,כי תשא,ויקהל,פקודי'],
['Leviticus','ויקרא','ויקרא,צו,שמיני,תזריע,מצורע,אחרי מות,קדושים,אמור,בהר,בחוקותי'],
['Numbers','במדבר','במדבר,נשא,בהעלותך,שלח,קרח,חוקת,בלק,פינחס,מטות,מסעי'],
['Deuteronomy','דברים','דברים,ואתחנן,עקב,ראה,שופטים,כי תצא,כי תבוא,נצבים,וילך,האזינו,וזאת הברכה']];
const ALN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שביעי','מפטיר'];
const $=s=>document.querySelector(s);
const load_=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
const set=Object.assign({fs:24,theme:'auto',teamim:true,verse:false,dia:false,done:{}},load_('sm_set',{}));
let bm=load_('sm_bm',null),P=[],cur=load_('sm_cur',{p:0,a:0}),mem={};
// מחזור הקריאה מתחלף בשמחת תורה (כ״ב/כ״ג תשרי)
function cycleYear(d=new Date()){try{const pr=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'}).formatToParts(d),g=t=>pr.find(x=>x.type===t).value;let y=+g('year');if(g('month')==='Tishri'&&+g('day')<23)y--;return y}catch{return 0}}
const save=()=>localStorage.setItem('sm_set',JSON.stringify(set));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)};
const heNum=n=>{const T=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];let s='';for(const[v,l]of T)while(n>=v){s+=l;n-=v}return s.replace(/יה$/,'טו').replace(/יו$/,'טז')};
const clean=t=>(t||'').replace(/<[^>]*>/g,'').replace(/\{[פס]\}/g,'').replace(/&nbsp;|&thinsp;/g,' ').trim();
const cmp=(x,y)=>(x.c-y.c)||(x.v-y.v);
function applyTheme(){const t=set.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):set.theme;document.documentElement.dataset.t=t;document.documentElement.style.setProperty('--fs',set.fs+'px')}
const R="1:1-6:8,6:9-11:32,12:1-17:27,18:1-22:24,23:1-25:18,25:19-28:9,28:10-32:3,32:4-36:43,37:1-40:23,41:1-44:17,44:18-47:27,47:28-50:26;1:1-6:1,6:2-9:35,10:1-13:16,13:17-17:16,18:1-20:23,21:1-24:18,25:1-27:19,27:20-30:10,30:11-34:35,35:1-38:20,38:21-40:38;1:1-5:26,6:1-8:36,9:1-11:47,12:1-13:59,14:1-15:33,16:1-18:30,19:1-20:27,21:1-24:23,25:1-26:2,26:3-27:34;1:1-4:20,4:21-7:89,8:1-12:16,13:1-15:41,16:1-18:32,19:1-22:1,22:2-25:9,25:10-30:1,30:2-32:42,33:1-36:13;1:1-3:22,3:23-7:11,7:12-11:25,11:26-16:17,16:18-21:9,21:10-25:19,26:1-29:8,29:9-30:20,31:1-31:30,32:1-32:52,33:1-34:12".split(';').map(x=>x.split(','));
async function j(u){const r=await fetch(API+u);if(!r.ok)throw new Error('HTTP '+r.status+' '+u);const d=await r.json();if(d.error)throw new Error(d.error);return d}
function loadIndex(){P=[];BOOKS.forEach((b,bi)=>b[2].split(',').forEach((name,i)=>P.push({book:b[0],bi,name,whole:b[0]+' '+R[bi][i],refs:null})))}
async function ensureRefs(i){const p=P[i];if(p.refs)return;
 try{const d=await j('v2/raw/index/'+p.book),ns=(d.alt_structs||d.alts).Parasha.nodes,k=P.filter(x=>x.bi===p.bi);
  if(ns.length===k.length)k.forEach((x,n)=>{if(ns[n].refs&&ns[n].refs.length>=7)x.refs=ns[n].refs})}catch(e){}
 if(!p.refs){const{m}=await loadP(i),n=m.length;p.refs=[];for(let a=0;a<7;a++){const s=m[Math.floor(a*n/7)],e=m[Math.floor((a+1)*n/7)-1];p.refs.push(`${p.book} ${s.c}:${s.v}-${e.c}:${e.v}`)}p.approx=1}}
const flat=d=>{if(!d.he||!d.he.length)throw new Error('אין טקסט עבור '+d.ref);const o=[],he=d.he;let c=d.sections[0],v=d.sections[1];
 if(Array.isArray(he[0]))he.forEach((ch,i)=>ch.forEach((t,k)=>o.push({c:c+i,v:(i?1:v)+k,t:clean(t)})));
 else he.forEach((t,k)=>o.push({c,v:v+k,t:clean(t)}));return o};
async function loadP(i){
 if(mem[i])return mem[i];const p=P[i],q='?context=0&pad=0';
 const w=p.whole.replace(p.book,'');
 const m=flat(await j('texts/'+encodeURIComponent(p.whole)+q));
 const tv=TARGUM_VERSION?'&vhe='+TARGUM_VERSION:'';
 const t=flat(await j('texts/'+encodeURIComponent('Onkelos '+p.book+w)+q+tv));
 return mem[i]={m,t};
}
const range=r=>{const x=r.match(/(\d+):(\d+)(?:-(?:(\d+):)?(\d+))?$/);const c=+x[1],v=+x[2];return[{c,v},{c:x[4]?(+x[3]||c):c,v:x[4]?+x[4]:v}]};
function vhtml(b,x){const id=`${b}-${x.c}-${x.v}`,on=bm&&bm.id===id&&bm.p===cur.p&&bm.a===cur.a;
 return `<p class="vs${on?' on':''}" id="${id}" data-b="${b}" data-c="${x.c}" data-v="${x.v}"><button class="bk" title="סימניה">🔖</button><span class="n">${heNum(x.c)}:${heNum(x.v)}</span>${tx(x.t)}</p>`}
const tx=t=>set.teamim?t:t.replace(/[\u0591-\u05AF]/g,'');
async function show(){
 localStorage.setItem('sm_cur',JSON.stringify(cur));
 const p=P[cur.p];$('#ps').value=cur.p;
 $('#ttl').textContent=`פרשת ${p.name} · ${ALN[cur.a]||'עליה '+(cur.a+1)}`;
 $('#ch').innerHTML='';$('#view').innerHTML='<p class="mut">טוען…</p>';
 try{
  await ensureRefs(cur.p);if(cur.a>=p.refs.length)cur.a=0;
  $('#ttl').textContent=`פרשת ${p.name} · ${ALN[cur.a]||'עליה '+(cur.a+1)}`;
  $('#ch').innerHTML=p.refs.map((_,i)=>`<button data-a="${i}" class="${i===cur.a?'on':''}${set.done[cur.p+'-'+i]?' dn':''}">${ALN[i]||i+1}${set.done[cur.p+'-'+i]?' ✓':''}</button>`).join('')+`<span class="pc">${p.refs.filter((_,i)=>set.done[cur.p+'-'+i]).length}/${p.refs.length} ✓</span>`;
  {const dn=!!set.done[cur.p+'-'+cur.a],b=$('#done');b.classList.toggle('dn',dn);b.textContent=dn?'✓ הושלם (בטל)':'סיימתי ✓'}
  const jn=$('#jn');if(joined&&(cur.p===joined.a||cur.p===joined.b)){const o=cur.p===joined.a?joined.b:joined.a;jn.innerHTML=`<span>השבוע פרשות מחוברות: ${P[joined.a].name}–${P[joined.b].name}</span><button data-jp="${o}">לפרשת ${P[o].name} ←</button>`;jn.hidden=false}else jn.hidden=true;
  if(p.approx&&!p.warned){p.warned=1;toast('חלוקת העליות משוערת (לא הצלחתי לטעון את החלוקה המדויקת)')}
  const{m,t}=await loadP(cur.p),[a,b]=range(p.refs[cur.a]),inr=x=>cmp(x,a)>=0&&cmp(x,b)<=0,mv=m.filter(inr),tv=t.filter(inr);
  let h='';
  if(set.verse)h=mv.map(x=>{const y=tv.find(z=>z.c===x.c&&z.v===x.v);return `<div class="sec vh">${vhtml('m1',x)}${vhtml('m2',x)}<div class="t">${y?vhtml('t',y):''}</div></div>`}).join('');
  else h=[['m1','מקרא · קריאה ראשונה',mv,''],['m2','מקרא · קריאה שנייה',mv,''],['t','תרגום אונקלוס',tv,' t']].map(([b,n,l,c])=>`<section class="sec${c}"><h2>${n}</h2>${l.map(x=>vhtml(b,x)).join('')}</section>`).join('');
  $('#view').innerHTML=h;
 }catch(e){$('#view').innerHTML=`<p class="mut">שגיאה בטעינת הטקסט: ${e.message||e}<br>בדוק חיבור לאינטרנט.</p><button onclick="show()">נסה שוב</button>`}
}
function go(p,a,top=true){cur={p,a};show().then(()=>top&&scrollTo(0,0))}
async function step(d){let{p,a}=cur;a+=d;
 try{
  if(a<0){if(p===0)return toast('זו תחילת התורה');p--;await ensureRefs(p);a=P[p].refs.length-1}
  else if(a>=P[p].refs.length){if(p===P.length-1)return toast('זה סוף התורה 🎉');p++;a=0}
 }catch(e){return toast('שגיאה בטעינה – בדוק חיבור לאינטרנט')}
 go(p,a)}
// השוואת שמות סלחנית (ניקוד, מקף, רווחים, כתיב מלא/חסר)
const loose=s=>(s||'').replace(/[֑-ֽֿ-ׇ]/g,'').replace(/[־\-\s'"״׳]/g,'').replace(/[וי]/g,'');
const startOf=r=>r.split('-')[0];
let joined=null;
async function today(){
 try{
  if(set.loc===undefined){set.dia=!confirm('לחשב את פרשת השבוע לפי ארץ ישראל?\n\nאישור = ארץ ישראל\nביטול = חו״ל\n\n(אפשר לשנות בהגדרות)');set.loc=1;save();$('#o-di').checked=set.dia}
  const n=new Date(),e=new Date(n.getTime()+6*864e5),f=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const r=await fetch(`https://www.hebcal.com/hebcal?v=1&cfg=json&s=on&leyning=on&i=${set.dia?'off':'on'}&start=${f(n)}&end=${f(e)}`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const it=(await r.json()).items.find(x=>x.category==='parashat');
  if(!it)return toast('בשבוע זה אין פרשה רגילה (שבת חג)');
  // רק טווח הקריאה הראשי (בלי מפטיר מיוחד), ובפורמט מלא: Deuteronomy 32:1-32:52
  const torah=it.leyning&&it.leyning.torah&&it.leyning.torah.split(/[;,]/)[0].trim().replace(/^(.* (d+):d+-)(d+)$/,'$1$2:$3');
  let i=-1,j=-1;
  if(torah){
   // זיהוי לפי הפסוקים: הפרשה שמתחילה באותו פסוק, ובפרשות מחוברות – גם זו שמסתיימת באותו פסוק
   const end=torah.split('-')[1];
   i=P.findIndex(p=>startOf(p.whole)===startOf(torah));
   if(i>=0){
    const k=P.findIndex(p=>p.book===P[i].book&&p.whole.endsWith('-'+end));
    if(k>i)j=k;
    if(j<0&&P[i].whole===torah){const refs=[1,2,3,4,5,6,7].map(a=>it.leyning[a]).filter(Boolean);if(refs.length===7){P[i].refs=refs;delete P[i].approx}}
   }
  }
  if(i<0){ // גיבוי: לפי השם
   const h=it.hebrew.replace('פרשת','').trim();
   i=P.findIndex(p=>loose(p.name)===loose(h));
   if(i<0){const names=h.split('-').map(x=>x.trim());i=P.findIndex(p=>loose(p.name)===loose(names[0]));if(i>=0&&names[1])j=P.findIndex(p=>loose(p.name)===loose(names[1]))}
  }
  if(i<0)throw new Error('לא נמצאה פרשה: '+it.hebrew);
  joined=j>i?{a:i,b:j}:null;
  go(i,n.getDay());
 }catch(e){toast('שגיאה באיתור פרשת השבוע: '+(e.message||e))}
}

 if(bm&&bm.id===id&&bm.p===cur.p&&bm.a===cur.a){bm=null;localStorage.removeItem('sm_bm');el.classList.remove('on');toast('הסימניה הוסרה');return}
 bm={p:cur.p,a:cur.a,id};localStorage.setItem('sm_bm',JSON.stringify(bm));
 document.querySelectorAll('.vs.on').forEach(x=>x.classList.remove('on'));el.classList.add('on');toast('הסימניה נשמרה כאן')});

$('#ch').onclick=e=>{const b=e.target.closest('button');if(b)go(cur.p,+b.dataset.a)};
$('#jn').onclick=e=>{const b=e.target.closest('[data-jp]');if(b)go(+b.dataset.jp,0)};
$('#rs').onclick=()=>{if(!confirm('לאפס את כל סימוני ✓ ולהתחיל מחזור חדש?'))return;set.done={};set.cycle=cycleYear();save();show();toast('התחלת מחזור חדש')};
$('#ps').onchange=e=>go(+e.target.value,0);
$('#today').onclick=today;$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#done').onclick=()=>{const k=cur.p+'-'+cur.a;set.done[k]=!set.done[k];save();toast(set.done[k]?'כל הכבוד! 🎉':'סומן כלא הושלם');if(set.done[k])step(1);else show()};
$('#fp').onclick=()=>{set.fs=Math.min(52,set.fs+2);save();applyTheme()};
$('#fm').onclick=()=>{set.fs=Math.max(14,set.fs-2);save();applyTheme()};
$('#dm').onclick=()=>{set.theme=document.documentElement.dataset.t==='dark'?'light':'dark';save();applyTheme()};
$('#sb').onclick=()=>{const s=$('#st');s.hidden=!s.hidden;s.open=true};
$('#o-tm').onchange=e=>{set.teamim=e.target.checked;save();show()};
$('#o-vm').onchange=e=>{set.verse=e.target.checked;save();show()};
$('#o-di').onchange=e=>{set.dia=e.target.checked;save()};
$('#off').onclick=async()=>{for(let i=0;i<P.length;i++){$('#offs').textContent=`מוריד… ${i+1}/${P.length}`;try{await loadP(i)}catch{$('#offs').textContent='נעצר – בדוק חיבור';return}}$('#offs').textContent='הכול נשמר ✓';mem={}};
{const cy=cycleYear();if(cy){if(!set.cycle)set.cycle=cy;else if(set.cycle!==cy){set.done={};set.cycle=cy;setTimeout(()=>toast('מחזור קריאה חדש – הסימונים אופסו'),800)}save()}}
applyTheme();$('#o-tm').checked=set.teamim;$('#o-vm').checked=set.verse;$('#o-di').checked=set.dia;
loadIndex();
$('#ps').innerHTML=BOOKS.map((b,bi)=>`<optgroup label="${b[1]}">${P.map((p,i)=>p.bi===bi?`<option value="${i}">${p.name}</option>`:'').join('')}</optgroup>`).join('');
if(!P[cur.p])cur={p:0,a:0};show();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
